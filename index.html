<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f7f4" />
    <script>
      // Apply the saved theme and language before the first paint, so a dark-mode user never sees a light
      // flash, the Android status bar matches from the start, and <html lang> is right for screen readers.
      // App.svelte's effects take over once mounted. Must match SETTINGS_KEY (src/lib/settings.ts), the
      // colours in App.svelte, and resolveLocale/HTML_LANG (src/lib/i18n/locale.ts). Never throws.
      (function () {
        var saved = null
        try { saved = JSON.parse(localStorage.getItem('lasttime.settings') || 'null') } catch (e) {}
        var theme = null, language = null
        try { theme = saved.theme; language = saved.language } catch (e) {}
        try {
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121411' : '#f6f7f4')
        } catch (e) {}
        try {
          var first = (navigator.languages && navigator.languages[0]) || ''
          var zh = language === 'zh-TW' || (language !== 'en' && /^zh/i.test(first))
          document.documentElement.lang = zh ? 'zh-Hant-TW' : 'en'
        } catch (e) {}
      })()
    </script>
    <!-- Root-relative on purpose: Vite prefixes public files with `base` (vite.config.ts) in dev and build. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>上次</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
