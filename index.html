<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f7f4" />
    <script>
      // Apply the saved theme before the first paint, so a dark-mode user never sees a light flash and the
      // Android status bar matches from the start. App.svelte's theme effect takes over once mounted.
      // Must match SETTINGS_KEY (src/lib/settings.ts) and the colours in App.svelte. Never throws.
      (function () {
        var theme = null
        try { theme = JSON.parse(localStorage.getItem('lasttime.settings') || 'null').theme } catch (e) {}
        try {
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121411' : '#f6f7f4')
        } catch (e) {}
      })()
    </script>
    <!-- Root-relative on purpose: Vite prefixes public files with `base` (vite.config.ts) in dev and build. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>上次</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
